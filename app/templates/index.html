<!DOCTYPE html>
<html>
<head>
   <h1>Diabetes Prediction System</h1>

<p class="subtitle">
Enter the patient's medical information below.
The prediction is generated using a trained Machine Learning model.
</p>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>Diabetes Prediction System</h1>

<form action="/predict" method="POST">

<label>Pregnancies</label>
<input type="number"
       name="Pregnancies"
       placeholder="e.g. 2"
       min="0"
       required>

<label>Glucose</label>
<input type="number"
       name="Glucose"
       placeholder="e.g. 120"
       min="0"
       required>

<label>Blood Pressure</label>
<input type="number"
       name="BloodPressure"
       placeholder="e.g. 70"
       min="0"
       required>

<label>Skin Thickness</label>
<input type="number"
       name="SkinThickness"
       placeholder="e.g. 20"
       min="0"
       required>

<label>Insulin</label>
<input type="number"
       name="Insulin"
       placeholder="e.g. 79"
       min="0"
       required>

<label>BMI</label>
<input type="number"
       step="0.1"
       name="BMI"
       placeholder="e.g. 25.5"
       min="0"
       required>

<label>Diabetes Pedigree Function</label>
<input type="number"
       step="0.001"
       name="DiabetesPedigreeFunction"
       placeholder="e.g. 0.351"
       min="0"
       required>

<label>Age</label>
<input type="number"
       name="Age"
       placeholder="e.g. 35"
       min="1"
       required>
<button type="submit">Predict</button>

</form>

</div>

</body>
</html>
